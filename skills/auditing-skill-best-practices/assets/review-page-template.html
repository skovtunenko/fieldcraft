<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; connect-src 'none'; img-src 'none'; base-uri 'none'; form-action 'none'">
<title>Skill audit review</title>
<style>
/* Visual system ported from interview-helper-builder's plan review page: cream paper, olive accent, serif headings. */
:root{
  color-scheme:light;--bg:#f6efdd;--paper:#fffcf4;--text:#352f25;--muted:#746952;
  --line:#dfd0ae;--accent:#526344;--soft:#e9ecdc;--gold:#b88e35;--bad:#98543f;
  --must:#98543f;--should:#8e6c37;--consider:#526344;
  --serif:Charter,"Iowan Old Style",Georgia,serif;--mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;--radius:22px;
  --shadow:0 2px 4px #5b48200a,0 12px 32px #5b482008;
  --annotation:linear-gradient(125deg,#ecf5ed 0%,#f3f1f6 52%,#f9e8d2 100%);
}
*{box-sizing:border-box}
html{scroll-padding-top:96px}
body{margin:0;color:var(--text);font:14px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(ellipse at 0% 0%,#dfe6cd80,transparent 42%),radial-gradient(ellipse at 100% 30%,#f6dfb540,transparent 38%),var(--bg)}
button,input,textarea,select{font:inherit}
button,select{cursor:pointer}
a{color:var(--accent)}
/* One button anatomy: variants only set --b-* tokens; hover grows the outer halo, press sinks. */
button{--b-top:#fffef9;--b-mid:#faf5e8;--b-bot:#f0e8d3;--b-line:#d6c9aa;--b-ink:var(--accent);--b-glint:#fffdf6;--b-halo:#86936e40;display:inline-flex;gap:7px;align-items:center;justify-content:center;min-height:34px;padding:6px 12px;color:var(--b-ink);background:linear-gradient(160deg,var(--b-top),var(--b-mid) 55%,var(--b-bot));border:1px solid var(--b-line);border-radius:999px;box-shadow:inset 0 0 0 2px var(--b-glint),0 0 0 var(--b-halo-w,var(--b-rest,0px)) var(--b-halo),0 2px 3px #59482012;transition:box-shadow .15s ease,filter .15s ease}
button:hover:not(:disabled){--b-halo-w:var(--b-hover,3px);filter:brightness(1.03) saturate(1.06)}
button:active:not(:disabled){transform:translateY(1px);filter:brightness(.96)}
button:disabled{cursor:default;opacity:.35;box-shadow:none}
button:focus-visible,select:focus-visible,a:focus-visible,summary:focus-visible,textarea:focus-visible{outline:3px solid #657650;outline-offset:3px}
.icon{display:inline-block;width:17px;height:17px;flex:0 0 auto;vertical-align:middle}
button.primary{min-height:44px;padding:10px 20px;font-weight:700;--b-top:#fff7d0;--b-mid:#efd580;--b-bot:#dfbd5b;--b-line:#b88c29;--b-ink:#483a13;--b-glint:#fff9e1;--b-halo:#86936e55;--b-rest:3px;--b-hover:4px}
/* Review marks read like the helper's Overall signal row: tinted icon at rest, the pressed decision fills with its tint. */
.q-actions button{gap:5px;min-height:30px;padding:5px 10px;font-size:11px;font-weight:600;--b-ink:var(--text)}
button.act-accept{--b-halo:#48663e33}
button.act-accept .icon{color:#48663e}
button.act-reject{--b-halo:#9c433633}
button.act-reject .icon{color:var(--bad)}
button.act-edit{--b-halo:#805f2033}
button.act-edit .icon{color:#805f20}
button.act-accept[aria-pressed="true"]{--b-top:#f6faf0;--b-mid:#e6efdb;--b-bot:#d2e2c3;--b-line:#48663e;--b-ink:#48663e;--b-glint:#fbfdf7;--b-halo:#48663e38;--b-rest:2px}
button.act-reject[aria-pressed="true"]{--b-top:#fff6f1;--b-mid:#fcece4;--b-bot:#f5dcd2;--b-line:var(--bad);--b-ink:var(--bad);--b-glint:#fffaf7;--b-halo:#9c433638;--b-rest:2px}
button.act-edit[aria-pressed="true"]{--b-top:#fdf7e4;--b-mid:#f8ebc4;--b-bot:#efdba3;--b-line:#805f20;--b-ink:#805f20;--b-glint:#fffbef;--b-halo:#805f2038;--b-rest:2px}
.decision-caption{color:var(--muted);font-size:12px;font-weight:700;margin-right:2px}
/* Text fields are paper sheets: inner glint at rest, mint wash once filled, the button halo on focus. */
textarea,select{max-width:100%;color:var(--text);border:1px solid #dccfb0;background:linear-gradient(#fffefb,#fffaf0);border-radius:12px;padding:10px 12px;outline:none;box-shadow:inset 0 0 0 2px #fffefa,inset 0 2px 5px #5948200a;transition:border-color .15s ease,box-shadow .15s ease}
textarea{display:block;width:100%;min-height:90px;resize:vertical;line-height:1.6}
textarea.code{font:12px/1.65 var(--mono)}
textarea::placeholder{color:#877b66;opacity:1;font-style:italic}
textarea:hover{border-color:#c4b58e}
textarea:not(:placeholder-shown){border-color:#bcc6a5;background:linear-gradient(#fdfef8,#f6f9ec)}
textarea:focus{border-color:#8e9f71;box-shadow:inset 0 0 0 2px #fffefa,0 0 0 3px #86936e40}
select{appearance:none;width:100%;padding:8px 32px 8px 13px;border-color:#c6cba8;border-radius:999px;font-size:12px;min-height:36px;background:linear-gradient(#fffef8,#f0f0df);box-shadow:inset 0 0 0 2px #fffdf5,0 2px 4px #5948200a}
select:hover{border-color:#8e9f71}
.select-wrap{display:flex;position:relative;min-width:0}
.select-wrap>.icon{position:absolute;right:11px;top:50%;transform:translateY(-50%);width:14px;height:14px;pointer-events:none;color:var(--accent)}
header{position:sticky;top:0;z-index:5;background:linear-gradient(#fffdf5,#fffaef);border-bottom:1px solid var(--line);box-shadow:var(--shadow)}
.head{display:flex;gap:20px;align-items:center;justify-content:space-between;max-width:1344px;margin:0 auto;padding:10px 0}
.brand{display:flex;gap:10px;align-items:center;min-width:0}
.brand-mark{width:37px;height:37px;display:grid;place-items:center;border:1px solid var(--gold);border-radius:50%;background:linear-gradient(145deg,#fdf7e8,#eee4c8);box-shadow:inset 0 0 0 3px #fffdf5;color:var(--accent)}
.brand-mark .icon{width:20px;height:20px}
.brand-name{font:italic 24px/1.1 var(--serif);letter-spacing:-.025em}
.brand-caption{font-size:9px;letter-spacing:.16em;font-weight:700;color:var(--muted);margin-top:3px;text-transform:uppercase}
/* Header tools: an uppercase caption over each control group, as in the interview helper's topbar. */
.tools{display:flex;gap:4px 14px;align-items:flex-start;flex-wrap:wrap}
.tgroup{display:flex;flex-direction:column;gap:2px}
.tcap{font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);padding-left:2px;line-height:1.2}
.head .tools button{min-height:32px;padding:5px 12px;font-size:12px;font-weight:650}
.seg{display:flex;border:1px solid #d6c9aa;border-radius:999px;background:linear-gradient(160deg,#fffef9,#faf5e8 55%,#f0e8d3);overflow:hidden;box-shadow:inset 0 0 0 2px #fffdf6,0 2px 3px #59482012;transition:box-shadow .15s ease}
.seg:hover{box-shadow:inset 0 0 0 2px #fffdf6,0 0 0 3px #86936e40,0 2px 3px #59482012}
.seg button{border:0;border-radius:0;background:transparent;box-shadow:none;--b-ink:var(--text)}
.seg button+button{border-left:1px solid #c9cbb8}
.seg button:hover:not(:disabled){background:#edf0e8}
.target{min-width:0;max-width:260px}
.target-pill{display:block;min-height:32px;padding:6px 12px;border:1px solid var(--line);border-radius:999px;background:linear-gradient(160deg,#fffef9,#f3ecda);box-shadow:inset 0 0 0 2px #fffdf6;font:600 12px/1.6 var(--mono);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.export-count{min-width:18px;padding:0 5px;border-radius:999px;background:var(--soft);border:1px solid #cdd4ba;color:var(--accent);font-size:11px;font-weight:800;text-align:center}
.layout{display:grid;grid-template-columns:272px minmax(0,1fr);gap:32px;max-width:1344px;margin:32px auto 0;padding:0 0 36px}
.sidebar{position:sticky;top:100px;align-self:start;max-height:calc(100dvh - 124px);overflow:auto;padding:19px 12px 16px;background:#fffaf0c9;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow)}
.sidebar-heading{display:flex;justify-content:space-between;align-items:center;padding:0 7px}
.sidebar h2{font:italic 500 19px/1.3 var(--serif);letter-spacing:-.01em;color:var(--accent);margin:0}
.side-count{font-size:11px;color:var(--accent);background:var(--soft);border:1px solid #cdd4ba;border-radius:999px;padding:2px 8px}
.hand-note{display:flex;gap:6px;align-items:center;color:var(--accent);font:italic 15px/1.4 var(--serif);margin:9px 7px 12px}
.filters{display:grid;gap:8px;padding:0 4px 6px}
.filters label{display:grid;gap:4px;font-size:10px;letter-spacing:.1em;font-weight:650;color:var(--muted);text-transform:uppercase}
.progress-bar{height:8px;margin:12px 7px 4px;border-radius:999px;background:#ece3cc;box-shadow:inset 0 1px 2px #59482014;overflow:hidden}
.progress-fill{height:100%;width:0;border-radius:999px;background:linear-gradient(90deg,#9aac7c,var(--accent));transition:width .2s ease}
.progress-meta{display:flex;justify-content:space-between;padding:0 7px;font-size:11px;color:var(--muted)}
/* Compact list like the helper's Interview flow: one line per failure, mono meta on the right, state by tint. */
#nav{display:grid;gap:4px;margin-top:12px}
.nav-item{display:flex;justify-content:space-between;gap:10px;align-items:center;width:100%;min-height:0;padding:8px;border:1px solid #e6dabd;border-radius:12px;text-align:left;color:var(--text);font-size:13px;line-height:1.45;background:linear-gradient(130deg,#fffef9,#f7f2e3);box-shadow:inset 0 1px 0 #fff;--b-halo:#86936e30}
.nav-item:hover:not(:disabled){background:linear-gradient(130deg,#f8fbef,#edf0dd);border-color:#a5b28c}
.nav-copy{display:flex;gap:6px;align-items:flex-start;min-width:0;overflow-wrap:anywhere}
.nav-copy .icon{width:14px;height:14px;margin-top:2px}
.nav-meta{flex:none;color:var(--muted);font:10px var(--mono)}
.nav-item[data-mark="accept"]{background:#eef3e6;border-color:#c9d6ba;color:#48663e}
.nav-item[data-mark="edit"]{background:#faf0d4;border-color:#dec994;color:#805f20}
.nav-item[data-mark="reject"]{background:#fcf0e9;border-color:#e7c6bb;color:#8d7968}
.nav-item[data-mark="reject"] .nav-text{text-decoration:line-through;text-decoration-color:#b88e76}
.nav-item.is-ref{opacity:.8}
/* A finding another card's edit also fixes sits indented under that card's row, which folds it away. */
.nav-group{display:grid;gap:4px}.nav-row{display:flex;gap:4px}.nav-row .nav-item{flex:1;min-width:0}
.chev.nav-toggle{align-self:center;width:auto;min-height:26px;padding:0 7px;border-radius:999px;display:flex;align-items:center;gap:2px;font:10px var(--mono)}
.nav-refs{display:grid;gap:4px;margin-left:14px;padding-left:8px;border-left:1px dashed #d8c9a4}
.nav-empty{margin:12px 7px;color:var(--muted);font-size:12px}
.sidebar-foot{margin:15px 7px 0;padding-top:13px;border-top:1px dashed var(--line)}
.sidebar-foot p{font-size:11px;color:var(--muted);margin:0 0 6px;line-height:1.6}
.sidebar-foot strong{color:var(--accent);font-weight:600}
main{min-width:0}
.hero{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:28px;align-items:end;margin:0 0 20px;padding:3px 4px 0}
.hero-main{min-width:0}
.eyebrow{font-size:10px;font-weight:750;letter-spacing:.14em;color:var(--accent);margin:0 0 9px;text-transform:uppercase}
h1{font:500 clamp(30px,3.5vw,45px)/1.12 var(--serif);letter-spacing:-.045em;margin:0;overflow-wrap:anywhere}
.hero-note{font:italic 22px/1.4 var(--serif);color:var(--accent);margin:7px 0 0}
.facts{display:grid;grid-template-columns:max-content minmax(0,1fr);gap:7px 18px;margin:18px 0 0;padding:14px 0 0;border-top:1px dashed #d8c9a3;font-size:13px;line-height:1.55}
.facts dt{color:var(--muted);font-size:10px;letter-spacing:.1em;text-transform:uppercase;font-weight:650;padding-top:3px}
.facts dd{margin:0;min-width:0;overflow-wrap:anywhere}
.facts .mono{font:12px/1.6 var(--mono)}
.facts a{display:inline-flex;gap:4px;align-items:center;color:var(--accent);font-weight:600}
.facts a .icon{width:12px;height:12px}
.fact-hint{display:block;color:var(--muted);font-size:12px}
.review-status{display:flex;gap:9px;align-items:center;margin:0 4px 20px;color:var(--muted);font-size:11px;line-height:1.5}
.status-dot{width:7px;height:7px;border-radius:50%;background:#809265;box-shadow:0 0 0 3px #e6ead8;flex:0 0 auto}
.review-status p{margin:0}
.storage-notice{margin:0 4px 20px;padding:10px 14px;border:1px solid #e2caa5;border-radius:14px;background:linear-gradient(135deg,#fbefdc,#fffdf6);color:#8e6c37;font-size:12px}
.context{min-width:260px}
.context-card{flex:1 1 240px;min-width:0;padding:19px 21px;border:1px solid #cbd3b6;border-radius:19px;background:linear-gradient(135deg,#f3f7e9,#fffdf6);box-shadow:inset 0 1px 0 #fff,0 4px 10px #54472306}
.context-title{display:flex;gap:9px;align-items:center;margin:0 0 10px;font:500 21px/1.25 var(--serif);letter-spacing:-.02em;color:var(--accent)}
.context-title .icon{width:21px;height:21px}
.tally{display:flex;gap:6px;flex-wrap:wrap}
.tally-row{display:flex;gap:16px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:8px 0;border-top:1px solid #e3e6d3;font-size:13px}
.tally-row:first-of-type{border-top:0;padding-top:2px}
.tally span{display:inline-flex;gap:6px;align-items:baseline;border:1px solid #d8ceb3;border-radius:999px;background:#fffdf5;padding:3px 11px;font-size:12px}
.tally b{font:italic 17px var(--serif)}
.tally .t-fail b{color:var(--bad)}
.section{margin:0 0 32px;scroll-margin-top:96px;min-width:0}
.section-head{display:flex;gap:12px;align-items:center;padding:9px 18px;background:#f0ead8;border:1px solid var(--line);border-radius:var(--radius) var(--radius) 0 0}
.section-number{display:grid;place-items:center;flex:0 0 auto;width:32px;height:32px;color:#fffdf5;background:var(--accent);border:3px solid #fffdf5;border-radius:50%;box-shadow:0 0 0 1px #cbd2b8;font:italic 17px var(--serif)}
.section.level-must .section-number{background:var(--must)}
.section.level-should .section-number{background:var(--should)}
.section-titles{min-width:0;flex:1}
.section-title{font:500 22px/1.2 var(--serif);letter-spacing:-.025em;margin:0;overflow-wrap:anywhere}
.section-context{color:var(--muted);font-size:11px;margin-top:3px}
.section-body{display:grid;gap:14px;padding:14px;background:#fffaf0;border:1px solid var(--line);border-top:0;border-radius:0 0 var(--radius) var(--radius);box-shadow:var(--shadow)}
.chev{width:34px;min-height:34px;padding:0;border-radius:50%;flex:0 0 auto;--b-top:#fffef8;--b-mid:#f6f6ea;--b-bot:#e6ebd5;--b-line:#899875;--b-ink:#455833;--b-glint:#fffdf5;--b-halo:#86936e4d}
.chev .icon{transition:transform .15s ease}
.chev[aria-expanded="false"] .icon{transform:rotate(-90deg)}
.section.collapsed .section-body{display:none}
.section.collapsed .section-head{border-radius:var(--radius)}
/* The left stripe carries the review state: olive accepted, gold edited, rust rejected. */
.question{min-width:0;overflow:hidden;border:1px solid #e1d5b8;border-left:3px solid #d8c9a3;border-radius:17px;background:var(--paper);box-shadow:0 2px 3px #54472306;scroll-margin-top:96px}
.question[data-mark]:not([data-mark=""]){border-left-width:7px}  /* a decided card reads apart from an open one at a glance */
.question[data-mark="accept"]{border-color:#a5b28c;border-left-color:var(--accent);box-shadow:0 0 0 2px #e2e8d6;background:#f4f8ec}
.question[data-mark="accept"] .q-top{background:linear-gradient(130deg,#f4f9ea,#dfe9cc)}
.question[data-mark="edit"]{border-color:#d1b46a;border-left-color:var(--gold);box-shadow:0 0 0 2px #f3e7c4;background:#fdf8e9}
.question[data-mark="edit"] .q-top{background:linear-gradient(130deg,#fffaea,#f4e5bd)}
.question[data-mark="reject"]{border-color:#cfad9a;border-left-color:var(--bad);background:#fcf4eb}
.question[data-mark="reject"] .q-title,.question[data-mark="reject"] .q-ask{color:#8d7968;text-decoration:line-through;text-decoration-color:#b88e76}
.question.flash{box-shadow:0 0 0 3px #b4c29b}
.q-top .chev{width:30px;min-height:30px}
.question.folded .q-main,.question.folded .q-footer{display:none}
.question.folded .q-top{border-bottom:0;cursor:pointer}
.question.folded .q-top:hover{background:linear-gradient(130deg,#f8fbef,#edf0dd)}
.q-top{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;gap:12px;align-items:start;padding:15px 20px;background:linear-gradient(130deg,#fffef9,#f7f2e3);border-bottom:1px solid var(--line)}
.question[data-mark="reject"] .q-top{background:linear-gradient(130deg,#fffaf4,#f6e6d8)}
.q-index{min-width:36px;height:30px;display:grid;place-items:center;padding:0 9px;color:#4f6440;font:italic 500 16px/1 var(--serif);background:linear-gradient(#fdfdf7,#e9ecd9);border:1px solid #b4c29b;border-radius:999px;box-shadow:inset 0 0 0 1px #fffdf5}
.q-heading{min-width:0}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.qid{color:#8d7041;font:italic 15px var(--serif)}
.q-kind{font-size:9px;letter-spacing:.1em;color:var(--muted);font-weight:650;text-transform:uppercase}
.badge{display:inline-flex;align-items:center;gap:5px;background:linear-gradient(#fdfdf7,#e9ecd9);border:1px solid #c1caa8;border-radius:999px;padding:2px 9px;font-size:11px;color:var(--accent);box-shadow:inset 0 0 0 1px #fffdf5}
.badge.level-must{color:var(--must);border-color:#d9b5a4;background:linear-gradient(#fffaf5,#f6e3d8)}
.badge.level-should{color:var(--should);border-color:#dcc497;background:linear-gradient(#fffcf2,#f4e8c9)}
.source-link{display:inline-flex;gap:4px;align-items:center;font-size:11px}
.source-link .icon{width:13px;height:13px}
.q-main{display:grid;gap:16px;padding:18px 22px 20px}
.q-source{min-width:0}
.q-title{font:500 21px/1.25 var(--serif);letter-spacing:-.025em;margin:4px 0 0;overflow-wrap:anywhere}
.ask-box{margin:0 0 12px;padding:0 0 12px;border-bottom:1px solid var(--line)}
.ask-label{margin:0 0 6px;color:#816829;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.q-ask{font-size:17px;line-height:1.6;margin:0;white-space:pre-wrap;overflow-wrap:anywhere}
.q-purpose{color:var(--muted);font-size:12px;line-height:1.65;margin:0 0 8px;white-space:pre-wrap;overflow-wrap:anywhere}
.q-purpose>span:first-child{font-weight:650;color:#8c7545}
.loc{font:11px/1.5 var(--mono);color:#71644b;background:#fffdf580;border:1px solid #d8ceb3;border-radius:999px;padding:1px 8px;overflow-wrap:anywhere}
.fix-block{margin-top:14px}
.fix-label{font-size:9px;letter-spacing:.1em;font-weight:650;color:var(--muted);text-transform:uppercase;margin:0 0 5px}
.diff{display:grid;grid-template-columns:1fr 1fr;gap:10px}
pre.snippet{margin:0;padding:9px 11px;border:1px solid #e1d5b8;border-radius:12px;background:#fffdf8;font:12px/1.6 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;box-shadow:inset 0 0 0 2px #fffefa}
/* Before/After read as the helper's signal panels: rust wash for what goes, green wash for what comes. */
.panel{margin-top:0;min-width:0;padding:12px;border:1px solid;border-radius:15px;box-shadow:inset 0 1px 0 #ffffffb3}
.panel.before{background:linear-gradient(135deg,#fcf0e9,#fffaf3);border-color:#e7c6bb}
.panel.after{background:linear-gradient(135deg,#eef3e6,#fafcf3);border-color:#c9d6ba}
.panel .fix-label{margin:0 0 8px;font-size:12px;font-weight:750;letter-spacing:0;text-transform:none}
.panel.before .fix-label{color:var(--bad)}
.panel.after .fix-label{color:#48663e}
.panel pre.snippet{padding:0;border:0;background:transparent;box-shadow:none}
.diff{margin-top:14px}
p.step{margin:0;font-size:13px;line-height:1.65;white-space:pre-wrap;overflow-wrap:anywhere}
mark{background:#f3dc95;color:#483a13;border-radius:4px;padding:0 2px;box-shadow:0 0 0 1px #d8b55a}
.placeholder-note{margin-top:12px;padding:8px 12px;border:1px solid #e2caa5;border-radius:12px;background:#fbefdc;color:#8e6c37;font-size:12px}
.feedback{min-width:0;padding:8px 10px 10px;border:1px solid #dec68b;border-radius:15px;background:var(--annotation);box-shadow:inset 0 1px 0 #ffffffb3}
.feedback label{display:flex;align-items:center;gap:6px;color:#706146;font:italic 13px/1.3 var(--serif);margin:0 0 5px}
.feedback label .icon{width:15px;height:15px;color:#8f743a}
.feedback .edit-wrap{margin-bottom:12px}
.feedback textarea{font-size:12px}
.feedback textarea:not(.code){min-height:44px;padding:7px 10px}

.also-decide{display:grid;gap:6px;margin-top:8px}
.also-decide button{justify-self:start;min-height:28px;padding:3px 10px;font-size:12px}

.q-footer{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin:0 22px;padding:11px 0 13px;border-top:1px dashed #e1d5b8}
.q-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.q-state{font-size:11px;color:var(--muted)}
.empty{padding:26px;text-align:center;font:italic 18px var(--serif);color:var(--accent);border:1px dashed #b4c29b;border-radius:var(--radius);background:#fffaf0;margin-bottom:28px}
.export{margin:8px 0 22px;padding:26px;border:1px solid #d3b875;border-radius:var(--radius);background:var(--annotation);box-shadow:var(--shadow)}

/* The instruction shows as highlighted source; its textarea appears only as the clipboard fallback. */
.syntax-preview{margin:10px 0 0;min-height:240px;max-height:560px;overflow:auto;padding:10px 12px;border-radius:12px;color:var(--text);font:12px/1.65 var(--mono);white-space:pre-wrap;overflow-wrap:anywhere;tab-size:2;border:1px solid #d7c395;background:#fffdf8;box-shadow:inset 0 0 0 2px #fffefa,inset 0 2px 5px #5948200a}

.syn-tag,.syn-link{color:#245ca6}

.syn-attr,.syn-code{color:#835718}
.syn-string,.syn-fence,.syn-entity{color:#8c3e73}
.syn-comment{color:#667085;font-style:italic}
.syn-marker{color:#875718;font-weight:700}
.syn-warn{color:var(--bad);font-weight:600}
#exportText{min-height:240px;margin-top:10px}
.copy-fallback{margin-top:10px;font-size:12px;color:var(--bad)}
details.rules{margin:0 0 32px;border:1px solid var(--line);border-radius:var(--radius);background:#fffaf0;box-shadow:var(--shadow)}
details.rules summary{display:flex;gap:10px;align-items:center;padding:18px 22px;font:500 22px/1.3 var(--serif);letter-spacing:-.02em;list-style:none;border-radius:var(--radius);background:#f0ead8}

.table-wrap{overflow-x:auto;padding:6px 14px 14px}
table{border-collapse:collapse;width:100%;font-size:12px}

[hidden]{display:none!important}

  .q-top{padding:12px 14px;gap:8px 10px}.q-top>.source-link{grid-column:3;grid-row:2}.q-main{padding:14px 14px 16px}.q-footer{margin:0 14px}.q-title{font-size:19px}.q-ask{font-size:15px}.diff{grid-template-columns:1fr}
  .export{padding:21px}.export-head{display:block}.export-head button{margin-top:16px}
}
@media(pointer:coarse){button,.head .tools button{min-height:44px}select{min-height:44px}.feedback textarea{font-size:16px}}

<body>

<script>
(function () {
  "use strict";
  var ARTICLE_URL = "https://platform.claude.com/docs/en/agents-and-tools/agent-skills/best-practices";
  var LEVELS = ["must", "should", "consider"];
  var data = JSON.parse(document.getElementById("audit-data").textContent);
  // English labels from assets/labels.json, with the translations the findings carry on top
  var L = Object.assign(JSON.parse(document.getElementById("page-labels").textContent), data.labels && data.labels.page);
  document.documentElement.lang = data.lang;
  function fill(label, value) { return label.replace("{s}", function () { return value; }); }
  var rulesById = {};
  data.rules.forEach(function (r) { rulesById[r.id] = r; });
  var failures = data.failures.map(function (f, i) {
    var r = rulesById[f.rule];
    return { key: "f" + i, f: f, rule: r, catalogue: r.id.slice(0, 2), isRef: typeof f.fix_ref === "string" };
  });
  var owner = {};  // owner[rule id] = the entry holding the edit
  failures.forEach(function (i) { if (!i.isRef && !owner[i.rule.id]) { owner[i.rule.id] = i; } });
  var markable = failures.filter(function (i) { return !i.isRef; });
  var timesFailed = {};  // rule id -> its failure count; a repeated rule's titles add the location to tell the cards apart
  failures.forEach(function (i) { timesFailed[i.rule.id] = (timesFailed[i.rule.id] || 0) + 1; });
  function titleOf(i, short) {
    if (timesFailed[i.rule.id] < 2) { return i.rule.title; }
    return i.rule.title + " · " + (short ? i.f.location.split("/").pop() : i.f.location);
  }
  var refsOf = {};  // owner card key -> the failures its edit also resolves; they show inside that card, not as cards
  failures.forEach(function (i) { if (i.isRef) { var k = owner[i.f.fix_ref].key; (refsOf[k] = refsOf[k] || []).push(i); } });
  var collapsed = {}, openRef = {};  // level / ref key -> view state only, not saved

  var storageKey = "skill-audit-review:" + data.audit_id;
  var storageOk = true;
  var state = {};
  try {
    var saved = window.localStorage.getItem(storageKey);
    if (saved) { state = JSON.parse(saved) || {}; }
  } catch (e) { storageOk = false; }
  function save() {
    if (storageOk) {
      try { window.localStorage.setItem(storageKey, JSON.stringify(state)); }
      catch (e) { storageOk = false; showStorageNotice(); }
    }
    refresh();
  }
  function showStorageNotice() {
    var n = document.getElementById("storage-notice");
    n.textContent = L.storageBlocked;
    n.hidden = false;
  }
  if (!storageOk) { showStorageNotice(); }
  var folded = state.folded || (state.folded = {});  // card key -> folded; saved in its own key so entry() never sees it
  var navClosed = state.navClosed || (state.navClosed = {});  // owner card key -> its sidebar group is folded
  function entry(key) {  // a finding rejected in an earlier round starts rejected, its reason as the comment
    var prior = failures[+key.slice(1)].f.reviewer_reason;
    return state[key] || (state[key] = { mark: prior ? "reject" : "", edited: null, comment: prior || "" });
  }
  function setMark(key, mark) {  // leaving an earlier round's rejection drops its reason, so it does not travel as a comment or a question
    var e = entry(key), prior = failures[+key.slice(1)].f.reviewer_reason;
    if (e.mark === "reject" && mark !== "reject" && prior && e.comment === prior) { e.comment = ""; }
    e.mark = mark;
    return e;
  }
  function refRejected(i) { return i.isRef && entry(i.key).mark === "reject"; }  // the reviewer disputes this finding, not the shared edit
  function markOf(i) { return refRejected(i) ? "reject" : (i.isRef ? entry(owner[i.f.fix_ref].key) : entry(i.key)).mark; }

  function el(tag, attrs, text) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) { node.setAttribute(k, attrs[k]); });

  }
  // One outline icon set: 20 viewBox, stroke 1.6, round caps, currentColor; each icon defined once here.
  var ICONS = {

    copy: ["M9 7h8v10H9z", "M12 7V3H3v10h6"],
    chevron: ["m6 8 4 4 4-4"],
    accept: ["m5 10.5 3.2 3.2L15 7"],
    reject: ["m6 6 8 8", "m14 6-8 8"],
    edit: ["m12 4 4 4", "M4 16l4-1L17 6a2.1 2.1 0 0 0-3-3l-9 9z"],
    note: ["M5 4h10v9l-4 4H5z", "M11 17v-4h4"],
    external: ["M11 4h5v5", "M16 4l-7 7", "M14 12v4H4V6h4"],
    rules: ["M4 5h12", "M4 10h12", "M4 15h8"],
    expand: ["m7 7 3-3 3 3", "m7 13 3 3 3-3"],
    collapse: ["m7 4 3 3 3-3", "m7 16 3-3 3 3"],
    down: ["M10 4v11", "m5 10 5 5 5-5"],
    reset: ["M4.5 10a5.5 5.5 0 1 0 1.8-4.1", "M4 3.5v3.5h3.5"]
  };
  function icon(name) {
    var ns = "http://www.w3.org/2000/svg";
    var svg = document.createElementNS(ns, "svg");
    [["class", "icon"], ["viewBox", "0 0 20 20"], ["fill", "none"], ["stroke", "currentColor"], ["stroke-width", "1.6"],
      ["stroke-linecap", "round"], ["stroke-linejoin", "round"], ["aria-hidden", "true"], ["focusable", "false"]]
      .forEach(function (a) { svg.setAttribute(a[0], a[1]); });
    ICONS[name].forEach(function (d) { var p = document.createElementNS(ns, "path"); p.setAttribute("d", d); svg.appendChild(p); });
    return svg;
  }
  function withIcon(node, name, text) {
    node.textContent = "";
    node.appendChild(icon(name));
    node.appendChild(document.createTextNode(text));
    return node;
  }
  function safeLink(url, text) {
    var a = el("a", { target: "_blank", rel: "noopener noreferrer" }, text);
    if (/^https:\/\//.test(url)) { a.href = url; }
    return a;
  }
  function marked(node, value, marks) {  // wrap each placeholder occurrence in <mark>, text nodes only
    var rest = String(value);
    while (rest) {
      var at = -1, hit = "";
      (marks || []).forEach(function (m) { var k = rest.indexOf(m); if (k >= 0 && (at < 0 || k < at)) { at = k; hit = m; } });
      if (at < 0) { node.appendChild(document.createTextNode(rest)); break; }
      node.appendChild(document.createTextNode(rest.slice(0, at)));
      node.appendChild(el("mark", {}, hit));
      rest = rest.slice(at + hit.length);

    return node;
  }
  function fixBlock(label, node) {
    var wrap = el("div", { "class": "fix-block" });
    wrap.appendChild(el("div", { "class": "fix-label" }, label));
    wrap.appendChild(node);
    return wrap;
  }
  function pending(text, marks) { return (marks || []).filter(function (m) { return String(text).indexOf(m) >= 0; }); }
  function showCard(key, refKey) {  // refKey: open that resolved rule inside the card and land on it
    var target = document.getElementById("card-" + key);
    if (!target) {
      ["filter-level", "filter-catalogue", "filter-state"].forEach(function (id) { document.getElementById(id).value = ""; });
      render();
      target = document.getElementById("card-" + key);
    }
    if (!target) { return; }
    var lv = target.getAttribute("data-level");
    if (collapsed[lv] || folded[key] || refKey) {
      collapsed[lv] = false; folded[key] = false;
      if (refKey) { openRef[refKey] = true; }
      save();
      render();
      target = document.getElementById(refKey ? "ref-" + refKey : "card-" + key);
    }

    target.classList.add("flash");
    setTimeout(function () { target.classList.remove("flash"); }, 1000);  // the highlight lasts one second
  }
  function isTextEdit(f) { return typeof f.before === "string" && typeof f.after === "string"; }
  function editsAfter(f) { return isTextEdit(f) && !f.range; }  // a large edit is edited through its Change step
  function changeOf(f) {  // a large edit's Change carries its first span, so an edited Change keeps the After its step names
    return (f.fix || "") + (f.range && isTextEdit(f) ? "\n\nBefore (first changed span):\n" + f.before + "\n\nAfter (first changed span):\n" + f.after : "");
  }
  function folder(path) { var parts = String(path).replace(/[\\/]+$/, "").split(/[\\/]/); return parts[parts.length - 1] || String(path); }
  function setStatus(text) { document.getElementById("status").textContent = text; }

  var name = folder(data.target);
  document.title = L.title + ": " + data.target;
  document.getElementById("brandMark").appendChild(icon("brand"));
  document.getElementById("brandName").textContent = L.brand;
  document.getElementById("brandCaption").textContent = L.brandCaption;
  document.getElementById("targetCaption").textContent = L.targetCaption;
  document.getElementById("targetName").textContent = name;
  document.getElementById("targetName").title = data.target;
  document.getElementById("eyebrow").textContent = L.eyebrow;
  document.getElementById("title").textContent = name;
  document.getElementById("heroNote").textContent = L.heroNote;
  var meta = document.getElementById("meta");
  function fact(label, value) { meta.appendChild(el("dt", {}, label)); meta.appendChild(value); }
  fact(L.factSkill, el("dd", { "class": "mono" }, data.target));
  var sourceDd = el("dd");  // the catalogue was distilled from this article on the snapshot date
  sourceDd.appendChild(withIcon(safeLink(ARTICLE_URL, ""), "external", L.sourceName));
  sourceDd.appendChild(document.createTextNode(" · " + L.snapshot.replace("{s}", data.snapshot)));
  fact(L.source, sourceDd);
  fact(L.audited, el("dd", {}, data.audited));
  if (data.auditor) { fact(L.auditor, el("dd", {}, data.auditor)); }
  var hostsDd = el("dd", {}, data.hosts);
  hostsDd.appendChild(el("span", { "class": "fact-hint" }, L.hostsHint));
  fact(L.hosts, hostsDd);
  if (data.generated && data.skill_version) {
    document.getElementById("stamp").textContent = L.generated.replace("{t}", data.generated).replace("{v}", data.skill_version);
  }
  document.getElementById("sideTitle").textContent = L.sideTitle;
  document.getElementById("sideCount").textContent = String(failures.length);
  document.getElementById("sideNote").textContent = L.sideNote;
  document.getElementById("sideFoot").textContent = L.sideFoot;
  setStatus(L.statusIdle);

  var context = document.getElementById("context");
  var results = el("div", { "class": "context-card" });
  results.appendChild(withIcon(el("h3", { "class": "context-title" }), "rules", L.results));
  [["BP", L.article], ["OS", L.other]].forEach(function (pair) {
    var c = { pass: 0, fail: 0, "n/a": 0 };
    data.rules.forEach(function (r) { if (r.id.slice(0, 2) === pair[0]) { c[r.status] += 1; } });
    var row = el("div", { "class": "tally-row" });
    row.appendChild(el("span", {}, pair[1]));
    var tally = el("div", { "class": "tally" });
    [["pass", "✅", ""], ["fail", "❌", "t-fail"], ["n/a", "n/a", ""]].forEach(function (s) {
      var chip = el("span", { "class": s[2] });
      chip.appendChild(el("b", {}, String(c[s[0]])));
      chip.appendChild(document.createTextNode(s[1]));
      tally.appendChild(chip);
    });
    row.appendChild(tally);
    results.appendChild(row);
  });
  context.appendChild(results);

  function fillSelect(id, labelId, label, options) {
    document.getElementById(labelId).textContent = label;
    var s = document.getElementById(id);
    options.forEach(function (o) { s.appendChild(el("option", { value: o[0] }, o[1])); });
    s.parentNode.appendChild(icon("chevron"));
    s.addEventListener("change", render);
  }
  fillSelect("filter-level", "filter-level-label", L.level, [["", L.all]].concat(LEVELS.map(function (l) { return [l, L[l]]; })));
  fillSelect("filter-catalogue", "filter-catalogue-label", L.catalogue, [["", L.all], ["BP", L.article], ["OS", L.other]]);
  fillSelect("filter-state", "filter-state-label", L.state,
    [["", L.all], ["none", L.unreviewed], ["accept", L.accepted], ["edit", L.edited], ["reject", L.rejected]]);

  var STATE_LABEL = { accept: L.accepted, edit: L.edited, reject: L.rejected, "": L.unreviewed };
  // Rules this edit also resolves: ID, title, and why always show; evidence and location open on click.
  function alsoFixes(refs) {
    var wrap = el("div", { "class": "fix-block also" });

      s.appendChild(head);
      s.appendChild(el("span", { "class": "also-why" }, ref.f.why));
      d.appendChild(s);
      var body = el("div", { "class": "also-body" });
      var ev = el("p", { "class": "q-purpose" });
      ev.appendChild(el("span", {}, L.evidence + ": "));
      ev.appendChild(document.createTextNode(ref.f.evidence));
      body.appendChild(ev);
      var row = el("div", { "class": "row" });
      row.appendChild(el("span", { "class": "q-kind" }, L.location));
      row.appendChild(el("span", { "class": "loc" }, ref.f.location));
      row.appendChild(withIcon(safeLink(ref.rule.source, ""), "external", L.source)).className = "source-link";

      var why = el("textarea", { id: "reason-" + ref.key, placeholder: L.rejectFindingHint, "aria-label": L.rejectFindingHint });
      why.value = rs.comment || "";
      why.hidden = rs.mark !== "reject";
      rb.addEventListener("click", function () { setMark(ref.key, entry(ref.key).mark === "reject" ? "" : "reject"); openRef[ref.key] = true; save(); render(); });
      why.addEventListener("input", function () { entry(ref.key).comment = why.value; save(); });
      decide.appendChild(rb);
      decide.appendChild(why);
      body.appendChild(decide);
      d.appendChild(body);
      wrap.appendChild(d);
    });
    return wrap;
  }
function reviewReplace(text, values) {
  var result=String(text || '');
  Object.keys(values || {}).forEach(function(key){ result=result.split(key).join(values[key]); });

        var reason = (entry(i.key).comment || "").trim();
        if (reason) { out = out.concat(block("Reviewer reason", reason)); } else { out.push("   Reviewer reason: none given"); }
        out.push("");
      });
    }
    if (questions.length) {
      out.push("The reviewer has questions about the findings below for the skill at " + data.target + " and has not decided on them yet. " +
        "Do not apply their fixes. Answer each question from the finding and the skill's files.", "");
      questions.forEach(function (i, n) {
        var f = i.f;
        out.push((picked.length + refused.length + n + 1) + ". " + i.rule.id + " " + i.rule.title + " (" + i.rule.level + ") [question from the reviewer]");
        out.push("   Location: " + f.location);
        out.push("   Why: " + f.why);
        out.push("   Evidence: " + f.evidence);
        if (f.range) { out.push("   Lines: " + f.range); }
        if (isTextEdit(f)) { out = out.concat(block("Proposed Before", f.before), block("Proposed After", f.after)); }
        if (f.fix) { out = out.concat(block("Proposed change", f.fix)); }
        out = out.concat(block("Reviewer question", entry(i.key).comment.trim()));
        out.push("");
      });
    }
    var last = picked.length + refused.length + questions.length + 1;
    if (!picked.length && !refused.length) {  // nothing changes, so there is nothing to re-audit
      out.push(last + ". Change no files. Reply with the answers only; the reviewer decides on these fixes on the page and exports again.");
    } else {
      out.push(last + ". Answer the reviewer's questions, if any, then briefly report the applied, skipped, and conflicting fixes for " + data.target +
        ", naming its new path if a fix renamed the folder. Offer to rerun the audit on request. Stop after this summary and offer, and wait for the user's reply. Do not run an audit, mechanical checker, or regenerate the review page. " +
        "Do not claim the fixes passed an audit. A new audit requires a separate explicit request from the user.");
    }
    return out.join("\n") + "\n";
  }

  // Highlighted Markdown and XML source, built from text nodes only (ported from interview-helper's highlightSyntax).
  // The first three alternatives mark the instruction's own structure: step lines, <<< >>> fences, and field labels.
  var SYNTAX = /^\d+\. [^\n]*|^   (?:<<<|>>>)$|^   [A-Z][A-Za-z ()]*:|<!--[\s\S]*?(?:-->|$)|<!\[CDATA\[[\s\S]*?(?:\]\]>|$)|<\/?[A-Za-z_](?:[^<>"']|"[^"]*"|'[^']*')*>|&(?:#\d+|#x[\da-f]+|[a-z]+);|^[ \t]{0,3}(?:`{3,}|~{3,})[^\n]*|`[^`\n]+`|\*\*[^*\n]+\*\*|__[^_\n]+__|\*[^*\n]+\*|_[^_\n]+_|\[[^\]\n]+\]\([^\n)]*\)|^[ \t]{0,3}#{1,6}[ \t]+[^\n]*|^[ \t]{0,3}(?:>|[-+*])[ \t]+/gmi;
  function highlightInto(pre, source) {
    var at = 0, fence = null, m;
    pre.textContent = "";
    function span(kind, text) { pre.appendChild(el("span", { "class": "syn-" + kind }, text)); }
    function plain(text) { if (!text) { return; } if (fence) { span("code", text); } else { pre.appendChild(document.createTextNode(text)); } }
    SYNTAX.lastIndex = 0;
    while ((m = SYNTAX.exec(source))) {
      var text = m[0], mark = text.match(/^[ \t]{0,3}(`{3,}|~{3,})(.*)$/);
      plain(source.slice(at, m.index));
      if (/^\d+\. /.test(text) && !fence) { span("heading", text); }
      else if (/^   (?:<<<|>>>)$/.test(text)) { span("marker", text); }
      else if (/^   [A-Z][A-Za-z ()]*:$/.test(text)) { span(/^   Warning:/.test(text) ? "warn" : "attr", text); }
      else if (mark) {
        span("fence", text);
        if (!fence) { fence = mark[1]; }
        else if (mark[1][0] === fence[0] && mark[1].length >= fence.length && !mark[2].trim()) { fence = null; }
      } else if (fence) { span("code", text); }
      else if (text.indexOf("<!--") === 0) { span("comment", text); }
      else if (text.indexOf("<![CDATA[") === 0) { span("code", text); }
      else if (text[0] === "<") {
        var end = m.index + text.length;
        var alone = (m.index === 0 || source[m.index - 1] === "\n") && (end === source.length || /[\r\n]/.test(source[end]));
        var tag = el("span", { "class": "syn-" + (alone ? "block" : "tag") }), pos = 0, a, attrs = /"[^"]*"|'[^']*'|[A-Za-z_][\w:.-]*(?=\s*=)/g;
        while ((a = attrs.exec(text))) {
          tag.appendChild(document.createTextNode(text.slice(pos, a.index)));
          tag.appendChild(el("span", { "class": /^["']/.test(a[0]) ? "syn-string" : "syn-attr" }, a[0]));
          pos = a.index + a[0].length;
        }
        tag.appendChild(document.createTextNode(text.slice(pos)));
        pre.appendChild(tag);
      } else {
        span(text[0] === "&" ? "entity" : text[0] === "`" ? "code" : /^[ \t]*#/.test(text) ? "heading" :
          /^(\*\*|__)/.test(text) ? "strong" : /^[*_]/.test(text) ? "em" : text[0] === "[" ? "link" : "marker", text);
      }
      at = m.index + text.length;
      if (!text) { SYNTAX.lastIndex++; }
    }
    plain(source.slice(at));
  }
  var exportArea = document.getElementById("exportText"), exportPre = document.getElementById("exportPreview");
  var generated = "", previewMode = true;
  if (typeof state.instruction === "string") { exportArea.value = state.instruction; }  // a hand-edited instruction survives reload like the marks
  function showPreview() {
    var text = exportArea.value;
    if (text) { exportPre.classList.remove("is-empty"); highlightInto(exportPre, text); }
    else { exportPre.classList.add("is-empty"); exportPre.textContent = L.nothingAccepted; }
  }
  function setMode(preview) {
    previewMode = preview;
    exportArea.hidden = preview;
    exportPre.hidden = !preview;
    if (preview) { showPreview(); }
    document.querySelectorAll("#syntaxToolbar [data-syntax-mode]").forEach(function (b) {
      b.setAttribute("aria-pressed", String((b.getAttribute("data-syntax-mode") === "preview") === preview));
    });
  }
  function syncExport() {  // a hand-edited instruction is kept until the reviewer rebuilds it
    var handEdited = exportArea.value !== generated;
    generated = buildExport();
    if (!handEdited) { exportArea.value = generated; }
    document.getElementById("exportEdited").hidden = !handEdited || exportArea.value === generated;
    if (previewMode) { showPreview(); }
    ["copyTop", "copyBottom"].forEach(function (id) { document.getElementById(id).disabled = !exportArea.value; });
  }
  function refresh() {
    var reviewed = markable.filter(function (i) { return entry(i.key).mark; }).length;
    var pct = markable.length ? Math.round(reviewed * 100 / markable.length) : 0;
    document.getElementById("progress").textContent = L.progress.replace("{n}", reviewed).replace("{m}", markable.length);
    document.getElementById("progressPct").textContent = pct + "%";
    document.getElementById("progressFill").style.width = pct + "%";
    document.getElementById("exportCount").textContent = String(markable.filter(applied).length + failures.filter(declined).length + markable.filter(asked).length);
    syncExport();
  }
  exportArea.addEventListener("input", function () {
    state.instruction = exportArea.value === generated ? null : exportArea.value;
    save();
  });
  document.getElementById("exportRebuild").addEventListener("click", function () { exportArea.value = generated; state.instruction = null; save(); });
  document.querySelectorAll("#syntaxToolbar [data-syntax-mode]").forEach(function (b) {
    var preview = b.getAttribute("data-syntax-mode") === "preview";
    b.textContent = preview ? L.syntaxPreview : L.syntaxEdit;
    b.addEventListener("click", function () { setMode(preview); if (!preview) { exportArea.focus(); } });
  });

  ["copyTop", "copyBottom"].forEach(function (id) {
    var b = withIcon(document.getElementById(id), "copy", L.copy);
    b.addEventListener("click", function () {
      var text = exportArea.value, hint = document.getElementById("copyFallback");
      if (!text) { setStatus(L.nothingAccepted); return; }
      function fallback() {
        setMode(false);
        hint.hidden = false;
        hint.textContent = L.copyFailed;
        exportArea.focus();
        exportArea.select();
        var ok = false;
        try { ok = document.execCommand("copy"); } catch (e) { ok = false; }
        setStatus(ok ? L.copied : L.copyFailed);
      }
      function done() { hint.hidden = true; setStatus(L.copied); }
      if (navigator.clipboard && window.isSecureContext) { navigator.clipboard.writeText(text).then(done, fallback); }
      else { fallback(); }
    });
  });
  var toExport = withIcon(document.getElementById("toExport"), "down", L.toExport);
  toExport.appendChild(el("span", { "class": "export-count", id: "exportCount" }, "0"));
  toExport.addEventListener("click", function () { document.getElementById("export").scrollIntoView({ block: "start" }); });
  document.getElementById("capCards").textContent = L.cards;
  document.getElementById("capExport").textContent = L.exportCap;
  document.getElementById("capReview").textContent = L.reviewCap;
  withIcon(document.getElementById("resetReview"), "reset", L.reset).addEventListener("click", function () {
    var keeps = failures.some(function (i) { return i.f.reviewer_reason; });  // Reset returns the page to how the agent built it
    if (!window.confirm(L.resetConfirm + (keeps ? " " + L.resetKeeps : ""))) { return; }
    state = {};  // decisions, edits, comments, folds, and a hand-edited instruction
    folded = state.folded = {};
    navClosed = state.navClosed = {};
    exportArea.value = generated;  // not hand-edited any more, so the next sync rebuilds it
    save();
    render();
  });
  document.getElementById("segCards").setAttribute("aria-label", L.cards);
  withIcon(document.getElementById("expandAll"), "expand", L.expandAll).addEventListener("click", function () {
    collapsed = {}; folded = state.folded = {}; save(); render();
  });
  withIcon(document.getElementById("collapseAll"), "collapse", L.collapseAll).addEventListener("click", function () {
    failures.forEach(function (i) { folded[i.key] = true; }); save(); render();  // headers stay, so the list reads as an overview
  });
  document.getElementById("exportEyebrow").textContent = L.exportEyebrow;
  document.getElementById("exportTitle").textContent = L.exportTitle;
  document.getElementById("exportHint").textContent = L.exportHint;
  document.getElementById("exportNote").textContent = L.exportNote;
  document.getElementById("previewTitle").textContent = L.previewTitle;
  document.getElementById("exportEditedText").textContent = L.handEdited;
  document.getElementById("exportRebuild").textContent = L.rebuild;
  document.getElementById("syntaxToolbar").setAttribute("aria-label", L.previewTitle);
  exportArea.setAttribute("aria-label", L.previewTitle);
  exportArea.placeholder = L.nothingAccepted;
  exportPre.setAttribute("aria-label", L.previewTitle);

  withIcon(document.getElementById("all-rules-title"), "chevron", L.allRules.replace("{n}", data.rules.length));
  var head = document.getElementById("rules-head");
  [L.rule, L.level, L.type, L.status, L.evidence].forEach(function (h) { head.appendChild(el("th", {}, h)); });
  var body = document.getElementById("rules-body");
  var STATUS = { pass: "✅", fail: "❌", "n/a": "n/a" };
  data.rules.forEach(function (r) {
    var tr = el("tr");
    var td = el("td", { "class": "rule-cell" });
    td.appendChild(safeLink(r.source, r.id));
    td.appendChild(document.createTextNode(r.title));
    tr.appendChild(td);
    tr.appendChild(el("td", {}, L[r.level]));
    tr.appendChild(el("td", {}, r.type));
    tr.appendChild(el("td", { "class": r.status === "fail" ? "st-fail" : "" }, STATUS[r.status]));
    tr.appendChild(el("td", { "class": "evidence" }, r.evidence));
    body.appendChild(tr);
  });
  render();
})();
</script>
</body>
</html>
