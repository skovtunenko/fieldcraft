interface:
  display_name: "Auditing Skill Best Practices"
  short_description: "Audit a skill; return counts and links to the full report"
  default_prompt: "Use $auditing-skill-best-practices <path-to-skill> to audit every rule into findings JSON and render the full report; return only counts and artifact links. Call bundled scripts through documented interfaces without reading their implementation. After applying reviewed fixes, offer a re-audit and wait for a separate request."
policy:
  allow_implicit_invocation: false
